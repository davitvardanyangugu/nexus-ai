<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0b10">
  <title>Alenaz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <button class="brand" id="brandButton" aria-label="Alenaz home">
          <span class="brand-mark">A</span>
          <span>Alenaz</span>
        </button>
        <button class="icon-button mobile-only" id="closeSidebar" aria-label="Close sidebar">×</button>
      </div>

      <button class="new-chat" id="newChatButton">
        <span>＋</span>
        <span>New chat</span>
      </button>

      <div class="sidebar-section">
        <div class="section-label">Tools</div>
        <button class="sidebar-action" id="sidebarSearch">
          <span>⌕</span><span>Search the web</span>
        </button>
        <button class="sidebar-action" id="sidebarImage">
          <span>✦</span><span>Create an image</span>
        </button>
      </div>

      <div class="sidebar-section grow">
        <div class="section-label">Recent</div>
        <div class="history-list" id="historyList"></div>
      </div>

      <div class="sidebar-footer">
        <div class="usage-pill" id="usagePill">Prototype</div>
        <button class="profile-button" id="settingsButton">
          <span class="avatar" id="avatarLetter">G</span>
          <span class="profile-copy">
            <strong id="profileName">Guest</strong>
            <small>Settings</small>
          </span>
          <span class="chevron">›</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-button menu-button" id="openSidebar" aria-label="Open sidebar">☰</button>
        <button class="model-pill" id="modelPill">
          <span class="status-dot"></span>
          <span id="modelLabel">Alenaz</span>
          <small id="modelName">loading…</small>
        </button>
        <div class="topbar-actions">
          <button class="topbar-button" id="searchToggle" aria-pressed="false">⌕ Search</button>
          <button class="icon-button" id="themeButton" aria-label="Toggle theme">☼</button>
        </div>
      </header>

      <div class="notice hidden" id="apiNotice"></div>

      <section class="conversation">
        <div class="welcome" id="welcome">
          <div class="hero-orb">
            <div class="hero-letter">A</div>
          </div>
          <p class="eyebrow">MEET ALENAZ</p>
          <h1>What can I help you create?</h1>
          <p class="welcome-copy">Chat, search the web, understand images and files, or turn an idea into a picture.</p>

          <div class="starter-grid">
            <button class="starter-card" data-prompt="Teach me something difficult in a simple way">
              <span class="starter-icon">◎</span>
              <span><strong>Learn</strong><small>Explain anything step by step</small></span>
            </button>
            <button class="starter-card" data-tool="search">
              <span class="starter-icon">⌕</span>
              <span><strong>Search</strong><small>Find current information online</small></span>
            </button>
            <button class="starter-card" data-tool="image">
              <span class="starter-icon">✦</span>
              <span><strong>Create image</strong><small>Turn a prompt into artwork</small></span>
            </button>
            <button class="starter-card" data-prompt="Help me build a cool app from scratch">
              <span class="starter-icon">⌘</span>
              <span><strong>Build</strong><small>Code, debug and brainstorm</small></span>
            </button>
          </div>
        </div>

        <div class="messages" id="messages"></div>
      </section>

      <div class="composer-wrap">
        <div class="mode-banner hidden" id="modeBanner">
          <span id="modeBannerIcon">⌕</span>
          <span id="modeBannerText">Web search enabled</span>
          <button id="clearMode" aria-label="Clear mode">×</button>
        </div>

        <div class="attachment-preview hidden" id="attachmentPreview">
          <div class="attachment-thumb" id="attachmentThumb">FILE</div>
          <div class="attachment-meta">
            <strong id="attachmentName"></strong>
            <small id="attachmentType"></small>
          </div>
          <button class="icon-button small" id="removeAttachment" aria-label="Remove attachment">×</button>
        </div>

        <div class="composer">
          <button class="composer-icon" id="attachButton" aria-label="Attach a file">＋</button>
          <input type="file" id="fileInput" hidden accept="image/*,.pdf,.txt,.md,.csv,.json,.doc,.docx,.ppt,.pptx">

          <textarea id="promptInput" rows="1" placeholder="Message Alenaz"></textarea>

          <div class="composer-actions">
            <select id="modeSelect" aria-label="Alenaz mode">
              <option value="auto">Auto</option>
              <option value="study">Study</option>
              <option value="creative">Creative</option>
              <option value="code">Code</option>
            </select>
            <button class="composer-icon" id="voiceButton" aria-label="Voice input">◉</button>
            <button class="send-button" id="sendButton" aria-label="Send message">↑</button>
          </div>
        </div>
        <p class="disclaimer">Alenaz can make mistakes. Check important information.</p>
      </div>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="settingsModal">
    <div class="modal">
      <div class="modal-head">
        <div>
          <p class="eyebrow">ALENAZ</p>
          <h2>Settings</h2>
        </div>
        <button class="icon-button" id="closeSettings">×</button>
      </div>

      <label class="setting-field">
        <span>Your display name</span>
        <input id="displayNameInput" maxlength="30" placeholder="Guest">
      </label>

      <label class="setting-row">
        <span><strong>Read answers aloud</strong><small>Uses your browser's text-to-speech voice.</small></span>
        <input type="checkbox" id="speakToggle">
      </label>

      <label class="setting-row">
        <span><strong>Compact messages</strong><small>Uses a tighter conversation layout.</small></span>
        <input type="checkbox" id="compactToggle">
      </label>

      <div class="danger-zone">
        <button class="secondary-button" id="clearHistoryButton">Clear chat history</button>
      </div>

      <button class="primary-button" id="saveSettings">Save settings</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
